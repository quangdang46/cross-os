# CI: lint + test + build (macOS + Windows) + artifacts (beads cross-os-qhp.1,
# cross-os-qhp.9).
#
# Plan: COMPREHENSIVE_PLAN.md §12 + Phase 5. The license-gate job stays
# REQUIRED (bead cross-os-qhp.5); this workflow adds build/test/packaging
# around it. Signing + notarization run only on release (secrets-gated);
# push/PR builds are unsigned but must compile + test green on both OSes.
# arm64 + amd64 matrix (§14 Q6). Windows native surface is the thin
# crossos-keyboard-win.dll only (§12) — built from source on every push
# (qhp.9: windows-dll job below), never committed as a binary.
#
# No test exclusions: the two long-standing failures (TestConfigPaths,
# TestCrashIsolation) asserted the wrong platform's expectations and were
# being skipped in CI. Both are fixed, so the whole module runs here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt check
        # $RUNNER_TEMP resolves on both macOS and Windows runners
        # (/tmp does not exist on windows-latest).
        run: gofmt -l core app platform extensions | tee "$RUNNER_TEMP/fmt.out" && test ! -s "$RUNNER_TEMP/fmt.out"
        # NOTE: repo root has no go.mod (multi-module: core, app,
        # platform/darwin/spike_*, extensions/finder-sync); per-module jobs below.
      - name: Vet + test core
        run: cd core && go vet ./... && go test -short ./...
      - name: Vet + test app shell
        run: cd app && go vet ./... && go test -short ./...
      - name: Vet + test spikes + finder-sync
        run: |
          cd platform/darwin/spike_a && go vet . && go test -short .
          cd ../spike_c && go vet . && go test -short .
          cd ../../../extensions/finder-sync && go vet . && go test -short .
      # spike_b main_test.go is //go:build windows (it calls windows-only
      # hook symbols); on macOS the package builds as the hook_other.go stub
      # with no test files. It still gets its own Windows-gated step — the
      # shared sweep above must stay green on macos-latest too.
      # unsafeptr is disabled for this package only (bead cross-os-qhp.9):
      # lowLevelProc's lParam→*KBDLLHOOKSTRUCT conversion is the documented
      # Win32 ABI (not a Go pointer escape), but vet's unsafeptr check fires
      # on the pattern regardless — real CI red on every push since
      # go-version:stable moved past the vet version that accepted it.
      # -unsafeptr=false is cmd/vet's sanctioned per-check suppression.
      - name: Vet + test spike_b (Windows only)
        if: matrix.os == 'windows-latest'
        run: cd platform/windows/spike_b && go vet -unsafeptr=false . && go test -short .

  # Frontend: run the vitest suite so the frontend gates are not
  # developer-only (bead cross-os-64q). Same macOS+Windows matrix the Go
  # lanes use — the os list is the single line above (lint-test.matrix.os),
  # repeated here as an explicit list rather than a YAML anchor so a typo in
  # one job cannot break the whole workflow file's parse.
  #
  # 'npm ci', NEVER 'npm install': install reports "up to date" against a tree
  # that is missing vitest / @testing-library / jsdom, because
  # node_modules/.package-lock.json agrees with itself rather than with
  # package.json. An install-based job can therefore be green on a tree that
  # cannot run the suite at all.
  shell:
    # macOS only, and that is the product: the shell is an AppKit window and
    # AppKit does not exist on Windows. The daemon below still builds for
    # both, which is what keeps the core cross-platform while the UI is not.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Build (SwiftPM)
        run: swift build -c release
      # The suite is an EXECUTABLE, not a `.testTarget`, and that is not a
      # preference: neither XCTest nor swift-testing is importable from the
      # Command Line Tools toolchain, so a `.testTarget` is dead on arrival
      # there and `swift test` reports a failure that is about the machine
      # rather than the code. The assertions live in
      # `Tests/Harness/Sources/CoreTests/Harness.swift` and the same source
      # runs under `swift test` on a machine with the full Xcode.
      - name: Shell suite
        run: swift run CoreTests
      # The wire is a TRANSCRIPTION of the Go client, so the numbers this
      # port is judged against are the ones in docs/baseline/.
      - name: Switcher geometry probe
        run: ./.build/release/CrossOS --geometry

  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            out: crossos
          - os: macos-latest
            goos: darwin
            goarch: amd64
            out: crossos
          - os: windows-latest
            goos: windows
            goarch: amd64
            out: crossos.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build core daemon
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # go build ./... emits no binary; build the daemon explicitly so the
        # artifact path below matches a real file.
        run: cd core && go build -o ${{ matrix.out }} ./cmd/crossos
      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossos-${{ matrix.goos }}-${{ matrix.goarch }}
          path: core/${{ matrix.out }}

  # Windows DLL: build the thin helper from source on every push (bead
  # cross-os-qhp.9). Proves the qhp.8 C sources still compile under MSVC and
  # all 5 frozen exports resolve — a future edit that breaks the DLL fails
  # here instead of silently shipping a stale binary. Unsigned build only;
  # signing the DLL/MSI stays cert-gated in qhp.6. No cert/secret needed.
  windows-dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CMake, VS generator)
        run: cmake -S platform/windows -B build/dll -G "Visual Studio 18 2026" -A x64
      - name: Build DLL (Release)
        run: cmake --build build/dll --config Release
      - name: Assert DLL exists
        shell: pwsh
        run: |
          $dll = Get-ChildItem build/dll -Recurse -Filter crossos-keyboard-win.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "crossos-keyboard-win.dll not produced"; exit 1 }
          "DLL=$($dll.FullName)"
          "DLL_BYTES=$($dll.Length)"
          "DLL_PATH=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Assert 5 frozen exports resolve (dumpbin, fail-closed)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $out = & $dumpbin.FullName /exports $env:DLL_PATH | Out-String
          foreach ($sym in @('CrossOS_HookInstall','CrossOS_HookUninstall','CrossOS_SendInput','CrossOS_UIPIStatus','CrossOS_DeviceId')) {
            if ($out -notmatch $sym) { Write-Error "export missing: $sym"; exit 1 }
            "EXPORT_OK=$sym"
          }
      - name: Upload DLL artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: crossos-keyboard-win-dll
          path: build/dll/**/crossos-keyboard-win.dll

  # Finder appex: compile-check the Swift extension on every push (bead
  # cross-os-dnj). Unsigned xcodebuild of the xcodegen project on
  # macos-latest (full Xcode): proves FinderSync.swift + SettingsStore.swift
  # still compile and the pbxproj stays in sync with project.yml. Signing /
  # embedding into the .app stays cert-gated in qhp.6. No cert/secret needed.
  finder-appex:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify xcodegen project in sync
        run: |
          brew install xcodegen
          xcodegen generate --spec extensions/finder-sync/project.yml --project extensions/finder-sync
          git diff --exit-code -- extensions/finder-sync/CrossOSFinderSync.xcodeproj || (echo "pbxproj out of sync with project.yml — run xcodegen and commit" && exit 1)
      - name: Build appex (unsigned, Debug)
        run: |
          xcodebuild -project extensions/finder-sync/CrossOSFinderSync.xcodeproj -scheme CrossOSFinderSync -configuration Debug -destination 'platform=macOS' CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES build

  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: License gate self-test (fixtures)
        run: bash scripts/ci/test-license-gate.sh
      - name: Run license gate on PR diff
        run: bash scripts/ci/license-gate.sh --diff origin/main
