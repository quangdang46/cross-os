# CI: lint + test + build (macOS + Windows) + artifacts (beads cross-os-qhp.1,
# cross-os-qhp.9).
#
# Plan: COMPREHENSIVE_PLAN.md §12 + Phase 5. The license-gate job stays
# REQUIRED (bead cross-os-qhp.5); this workflow adds build/test/packaging
# around it. Signing + notarization run only on release (secrets-gated);
# push/PR builds are unsigned but must compile + test green on both OSes.
# arm64 + amd64 matrix (§14 Q6). Windows native surface is the thin
# crossos-keyboard-win.dll only (§12) — built from source on every push
# (qhp.9: windows-dll job below), never committed as a binary.
#
# No test exclusions: the two long-standing failures (TestConfigPaths,
# TestCrashIsolation) asserted the wrong platform's expectations and were
# being skipped in CI. Both are fixed, so the whole module runs here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt check
        # $RUNNER_TEMP resolves on both macOS and Windows runners
        # (/tmp does not exist on windows-latest).
        #
        # `app` is NOT in the list: the Wails app was deleted (bead
        # cross-os-app-delete) and the shell is Swift now, so `gofmt -l app`
        # was failing the step on "lstat app: no such file or directory" —
        # every push red, and for a directory that is not there.
        run: gofmt -l core platform extensions plugins | tee "$RUNNER_TEMP/fmt.out" && test ! -s "$RUNNER_TEMP/fmt.out"
        # NOTE: repo root has no go.mod (multi-module: core,
        # plugins/*, platform/darwin/spike_*, extensions/finder-sync);
        # per-module jobs below.
      - name: Vet + test core
        # **THE SCRIPT IS RUN UNDER BASH, NOT POWERSHELL.**
        #
        # The Windows runner's default shell for `run:` is pwsh, and pwsh
        # does not run a bash script: "./scripts/build-core.sh: The term
        # './scripts/build-core.sh' is not recognized as a name of a cmdlet".
        shell: bash
        # **THE STAMPED PATH, NOT `go test`.**
        #
        # Go's build cache keys a cgo package on the .go files and the
        # compiler flags, and NOT on the C files a cgo preamble reaches with
        # `#include` — the AX bridge and the tap bridge are plain .c files
        # that way. A plain `go test` can therefore link a STALE bridge: the
        # suite runs, the daemon in it is the one from before the edit, and
        # the result answers a question nobody asked. A cold runner gets it
        # right by accident; a warm build cache gets it wrong quietly.
        #
        # scripts/build-core.sh stamps the C sources' content into
        # CGO_CFLAGS, which changes the action id and does recompile them.
        # It is the same path the release workflow builds the artifact with.
        run: |
          # The `cd` is in a subshell: the script below is at the REPO ROOT,
          # and a `cd core` that outlived its line would make it
          # "no such file or directory".
          (cd core && go vet ./...)
          ./scripts/build-core.sh --test
      # **THE PLUGIN MODULES ARE TESTED HERE.**
      #
      # plugins/developer, plugins/launcher and plugins/windows-keyboard are
      # separate Go modules with their own suites — including the parity
      # test that pins the core rule table against the plugin matrices.
      # Nothing ran them: CI covered core and the spikes, so a plugin whose
      # matrix drifted from the table it is ported into shipped green.
      # `replace crossos/core => ../../core` is what lets them build here.
      - name: Vet + test the builtin plugin modules
        run: |
          cd plugins/developer && go vet ./... && go test -short ./...
          cd ../launcher && go vet ./... && go test -short ./...
          cd ../windows-keyboard && go vet ./... && go test -short ./...
      - name: Vet + test spikes + finder-sync
        run: |
          cd platform/darwin/spike_a && go vet . && go test -short .
          cd ../spike_c && go vet . && go test -short .
          cd ../../../extensions/finder-sync && go vet . && go test -short .
      # spike_b main_test.go is //go:build windows (it calls windows-only
      # hook symbols); on macOS the package builds as the hook_other.go stub
      # with no test files. It still gets its own Windows-gated step — the
      # shared sweep above must stay green on macos-latest too.
      # unsafeptr is disabled for this package only (bead cross-os-qhp.9):
      # lowLevelProc's lParam→*KBDLLHOOKSTRUCT conversion is the documented
      # Win32 ABI (not a Go pointer escape), but vet's unsafeptr check fires
      # on the pattern regardless — real CI red on every push since
      # go-version:stable moved past the vet version that accepted it.
      # -unsafeptr=false is cmd/vet's sanctioned per-check suppression.
      - name: Vet + test spike_b (Windows only)
        if: matrix.os == 'windows-latest'
        run: cd platform/windows/spike_b && go vet -unsafeptr=false . && go test -short .

  # Frontend: run the vitest suite so the frontend gates are not
  # developer-only (bead cross-os-64q). Same macOS+Windows matrix the Go
  # lanes use — the os list is the single line above (lint-test.matrix.os),
  # repeated here as an explicit list rather than a YAML anchor so a typo in
  # one job cannot break the whole workflow file's parse.
  #
  # 'npm ci', NEVER 'npm install': install reports "up to date" against a tree
  # that is missing vitest / @testing-library / jsdom, because
  # node_modules/.package-lock.json agrees with itself rather than with
  # package.json. An install-based job can therefore be green on a tree that
  # cannot run the suite at all.
  shell:
    # macOS only, and that is the product: the shell is an AppKit window and
    # AppKit does not exist on Windows. The daemon below still builds for
    # both, which is what keeps the core cross-platform while the UI is not.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      # **GO IS ON THE PATH FOR THIS JOB TOO.**
      #
      # The audit and the click test read a LIVE daemon, so the job starts
      # one — and the daemon is built from Go. Without this step the build
      # step failed with "./scripts/build-core.sh: line 65: go: command not
      # found", which is how this job died before it reached a single check.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build (SwiftPM)
        run: swift build -c release
      # The suite is an EXECUTABLE, not a `.testTarget`, and that is not a
      # preference: neither XCTest nor swift-testing is importable from the
      # Command Line Tools toolchain, so a `.testTarget` is dead on arrival
      # there and `swift test` reports a failure that is about the machine
      # rather than the code. The assertions live in
      # `Tests/Harness/Sources/CoreTests/Harness.swift` and the same source
      # runs under `swift test` on a machine with the full Xcode.
      - name: Shell suite
        run: swift run CoreTests
      # The wire is a TRANSCRIPTION of the Go client, so the numbers this
      # port is judged against are the ones in docs/baseline/.
      - name: Switcher geometry probe
        run: ./.build/release/CrossOS --geometry
      # The design audit, which is what a screenshot cannot do in CI: it
      # needs no display because it measures rather than photographs. It
      # exits non-zero on a FAIL, so a palette that drops below its contrast
      # floor or a row that collapses to nothing stops the build — which is
      # the check the React suite could not provide, because jsdom does not
      # load a stylesheet and a green run there meant a page nobody had
      # looked at.
      #
      # It reads a live daemon, so this step starts one first. The audit is
      # about the UI against real data, and every page against an empty
      # fixture is an audit of nothing.
      - name: Start the daemon
        # The build runs at the REPO ROOT, not in `macos`: the job's default
        # working directory is `macos`, and `go -C core` from there means
        # `macos/core`, which is not a directory. The daemon is built by the
        # repo's own script because `go build` alone does not invalidate the
        # cgo cache when a C source changes — see scripts/build-core.sh and
        # AGENTS.md.
        working-directory: .
        run: |
          ./scripts/build-core.sh
          ./.crossos/crossos serve &
          for _ in $(seq 1 20); do
            [ -S "$HOME/Library/Application Support/CrossOS/crossos.sock" ] && break
            sleep 0.5
          done
      # AGAINST A COLD DAEMON. The step above starts a fresh one, and that is
      # load-bearing rather than incidental: two views on `core.home` measure
      # from rows the daemon has not sent yet, so they measured 0pt tall and
      # the audit reported
      #
      #     [FAIL] core.home — NSStackView (wrapping NSStackView) is 0.0pt tall
      #
      # **only on a cold daemon.** Every green audit in this repo's history was
      # measured against a daemon that had been up for hours and already had
      # rows, so the defect never showed locally and CI's red read as flaky.
      #
      # If this step is ever pointed at an already-running daemon, it stops
      # being the check it is named as being.
      - name: Design audit
        run: ./.build/release/CrossOS --audit

      # The click test, which is the only gate that proves a control REACHES
      # the daemon rather than merely drawing.
      #
      # `--audit` measures frames and contrast. It cannot see that a checkbox
      # clicks, sends the wrong parameter name and is refused, or that a button
      # prints "not wired yet" and does nothing — every one of which shipped
      # in this repo. That class of defect is invisible to every check that
      # exists except this one, and this one was not in CI.
      #
      # It is destructive by design: it presses PANIC STOP and Reset
      # Everything, which is the only way to prove they reach the daemon. The
      # daemon is started by the step above on the runner and dies with the
      # job, so nothing is left changed.
      - name: Click test
        run: ./.build/release/CrossOS --click-test

  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            out: crossos
          # **THE INTEL BUILD RUNS ON AN INTEL RUNNER.**
          #
          # cgo cannot be cross-compiled: Go turns CGO_ENABLED off when the
          # target has no C compiler, and the cgo files are then left out of
          # the build entirely — so the darwin/amd64 build from an arm64
          # runner failed with
          #
          #     internal/adapter/tap_darwin.go:30:12: undefined: TapInstall
          #
          # and every push was red. The Intel artifact is built where the
          # C compiler matches the target: on macos-15-intel.
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            out: crossos
          - os: windows-latest
            goos: windows
            goarch: amd64
            out: crossos.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build core daemon
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # go build ./... emits no binary; build the daemon explicitly so the
        # artifact path below matches a real file.
        #
        # The build script, not `go build`: Go's build cache keys a cgo
        # package on the .go files and the compiler flags, NOT on the C
        # sources the cgo preamble #includes — so a plain `go build` links a
        # STALE ax_bridge.o and the binary disagrees with the source.
        # scripts/build-core.sh stamps the C sources' content into
        # CGO_CFLAGS, which does invalidate the cache.
        run: ./scripts/build-core.sh --out "core/${{ matrix.out }}"
      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossos-${{ matrix.goos }}-${{ matrix.goarch }}
          path: core/${{ matrix.out }}

  # Windows DLL: build the thin helper from source on every push (bead
  # cross-os-qhp.9). Proves the qhp.8 C sources still compile under MSVC and
  # all 5 frozen exports resolve — a future edit that breaks the DLL fails
  # here instead of silently shipping a stale binary. Unsigned build only;
  # signing the DLL/MSI stays cert-gated in qhp.6. No cert/secret needed.
  windows-dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CMake, VS generator)
        run: cmake -S platform/windows -B build/dll -G "Visual Studio 18 2026" -A x64
      - name: Build DLL (Release)
        run: cmake --build build/dll --config Release
      - name: Assert DLL exists
        shell: pwsh
        run: |
          $dll = Get-ChildItem build/dll -Recurse -Filter crossos-keyboard-win.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "crossos-keyboard-win.dll not produced"; exit 1 }
          "DLL=$($dll.FullName)"
          "DLL_BYTES=$($dll.Length)"
          "DLL_PATH=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Assert 5 frozen exports resolve (dumpbin, fail-closed)
        shell: pwsh
        run: |
          # **THE TOOLCHAIN IS FOUND ON DISK, NOT THROUGH vswhere.**
          #
          # vswhere answers with the INSTALLATION PATH, and the query this
          # step used asked for a component id that the current Visual Studio
          # does not report under that name — so vswhere returned nothing and
          # the path became "\VC\Tools\MSVC", which resolved to "D:\VC\Tools\"
          # and failed with "Cannot find path". The DLL itself built fine
          # (the CMake step above it uses the same toolchain); only the
          # LOOKUP was broken.
          #
          # So dumpbin is found where it lives. vswhere is asked WITHOUT the
          # component filter — that filter was the reason it answered with
          # nothing — and the directory scan is the fallback for the case
          # where vswhere does not know about the installation either.
          $roots = @()
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if ($vs) { $roots += (Join-Path $vs 'VC\Tools\MSVC') }
          # The layout is <root>\<year>\<edition>\VC\Tools\MSVC, so the
          # search goes two levels in: a search that stops one level short
          # finds nothing.
          $roots += @("${env:ProgramFiles(x86)}\Microsoft Visual Studio", "${env:ProgramFiles}\Microsoft Visual Studio") |
                    Where-Object { Test-Path $_ } |
                    ForEach-Object { Get-ChildItem $_ -Directory -ErrorAction SilentlyContinue } |
                    ForEach-Object { Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue } |
                    ForEach-Object { Join-Path $_.FullName 'VC\Tools\MSVC' }
          $roots = $roots | Where-Object { Test-Path $_ } | Select-Object -Unique
          if (-not $roots) { Write-Error "no Visual Studio MSVC toolchain found"; exit 1 }
          $dumpbin = $roots | ForEach-Object { Get-ChildItem $_ -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue } |
                     Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found under: $roots"; exit 1 }
          $out = & $dumpbin.FullName /exports $env:DLL_PATH | Out-String
          foreach ($sym in @('CrossOS_HookInstall','CrossOS_HookUninstall','CrossOS_SendInput','CrossOS_UIPIStatus','CrossOS_DeviceId')) {
            if ($out -notmatch $sym) { Write-Error "export missing: $sym"; exit 1 }
            "EXPORT_OK=$sym"
          }
      - name: Upload DLL artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: crossos-keyboard-win-dll
          path: build/dll/**/crossos-keyboard-win.dll

  # Finder appex: compile-check the Swift extension on every push (bead
  # cross-os-dnj). Unsigned xcodebuild of the xcodegen project on
  # macos-latest (full Xcode): proves FinderSync.swift + SettingsStore.swift
  # still compile and the pbxproj stays in sync with project.yml. Signing /
  # embedding into the .app stays cert-gated in qhp.6. No cert/secret needed.
  finder-appex:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify xcodegen project in sync
        run: |
          brew install xcodegen
          xcodegen generate --spec extensions/finder-sync/project.yml --project extensions/finder-sync
          git diff --exit-code -- extensions/finder-sync/CrossOSFinderSync.xcodeproj || (echo "pbxproj out of sync with project.yml — run xcodegen and commit" && exit 1)
      - name: Build appex (unsigned, Debug)
        run: |
          xcodebuild -project extensions/finder-sync/CrossOSFinderSync.xcodeproj -scheme CrossOSFinderSync -configuration Debug -destination 'platform=macOS' CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES build

  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: License gate self-test (fixtures)
        run: bash scripts/ci/test-license-gate.sh
      - name: Run license gate on PR diff
        run: bash scripts/ci/license-gate.sh --diff origin/main
